<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="45%" stop-color="#0A1022" />
      <stop offset="80%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <radialGradient id="radialGlow" cx="28%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#4F46E5" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>

    <!-- Typography Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E0F2FE" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <linearGradient id="subtextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Isometric Cube Gradients -->
    <linearGradient id="bannerCubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="bannerCubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="bannerCubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7490" />
      <stop offset="100%" stop-color="#090E1A" />
    </linearGradient>

    <linearGradient id="bannerPillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bannerBg)" />
  <rect width="1200" height="360" rx="16" fill="url(#radialGlow)" />
  
  <!-- Subtle Outer Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1" />

  <!-- Background Cyber Circuit Grid -->
  <g opacity="0.18" stroke="#38BDF8" stroke-width="1.2">
    <line x1="80" y1="0" x2="80" y2="360" stroke-dasharray="4 8" />
    <line x1="220" y1="0" x2="220" y2="360" stroke-dasharray="4 8" />
    <line x1="380" y1="0" x2="380" y2="360" stroke-dasharray="4 8" />
    <line x1="820" y1="0" x2="820" y2="360" stroke-dasharray="4 8" />
    <line x1="1040" y1="0" x2="1040" y2="360" stroke-dasharray="4 8" />

    <line x1="0" y1="60" x2="1200" y2="60" stroke-dasharray="4 8" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke-dasharray="4 8" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke-dasharray="4 8" />

    <!-- Angled Circuit Connectors -->
    <path d="M 380 60 L 440 120 L 520 120" fill="none" />
    <path d="M 820 60 L 760 120 L 700 120" fill="none" />
    <path d="M 380 300 L 440 240 L 520 240" fill="none" />
    <path d="M 820 300 L 760 240 L 700 240" fill="none" />
  </g>

  <!-- Left Side: MCP Storage Icon & Neural Core -->
  <g transform="translate(40, 10)">
    <!-- Circuit connection lines to the right text -->
    <path d="M 280 180 L 420 180" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.4" stroke-dasharray="6 6" />
    <circle cx="420" cy="180" r="4" fill="#38BDF8" opacity="0.7" />

    <!-- Orbital Energy Rings -->
    <ellipse cx="190" cy="185" rx="130" ry="55" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.25" transform="rotate(-18 190 185)" stroke-dasharray="6 10" />
    <ellipse cx="190" cy="185" rx="130" ry="55" fill="none" stroke="#2DD4BF" stroke-width="2" opacity="0.6" transform="rotate(22 190 185)" filter="url(#subtleNeon)" stroke-dasharray="50 120" />

    <!-- Isometric Shadow -->
    <ellipse cx="190" cy="275" rx="85" ry="24" fill="#020617" opacity="0.8" />

    <!-- Isometric Inventory Unit -->
    <g id="banner-cube" transform="translate(0, -6)">
      <!-- Top Face -->
      <path d="M 190 100 L 265 142 L 190 185 L 115 142 Z" fill="url(#bannerCubeTop)" />
      <!-- Left Face -->
      <path d="M 115 142 L 190 185 L 190 270 L 115 228 Z" fill="url(#bannerCubeLeft)" />
      <!-- Right Face -->
      <path d="M 190 185 L 265 142 L 265 228 L 190 270 Z" fill="url(#bannerCubeRight)" />

      <!-- Isometric Seams -->
      <path d="M 190 100 L 190 185 M 115 142 L 190 185 M 265 142 L 190 185" fill="none" stroke="#A5F3FC" stroke-width="1.8" opacity="0.65" />

      <!-- Top Face Microgrid -->
      <polygon points="190,118 240,146 190,174 140,146" fill="none" stroke="#CFFAFE" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.85" filter="url(#subtleNeon)" />
      <circle cx="190" cy="146" r="5" fill="#E0F2FE" />

      <!-- Left Bar Stock Metrics -->
      <line x1="135" y1="182" x2="168" y2="200" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
      <line x1="135" y1="197" x2="160" y2="211" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
      <line x1="135" y1="212" x2="175" y2="234" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

      <!-- Right Bar Stock Metrics -->
      <line x1="212" y1="200" x2="245" y2="182" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
      <line x1="220" y1="211" x2="245" y2="197" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
      <line x1="205" y1="234" x2="245" y2="212" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    </g>

    <!-- MCP Neural Connector Plug -->
    <g filter="url(#bannerGlow)">
      <path d="M 190 44 L 190 100" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 148 56 L 190 80 L 232 56" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="148" cy="56" r="4.5" fill="#38BDF8" />
      <circle cx="232" cy="56" r="4.5" fill="#38BDF8" />
      <circle cx="190" cy="44" r="5.5" fill="#2DD4BF" />
      <circle cx="190" cy="72" r="3" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Right Side: Typographic Branding & Technical Capabilities -->
  <g transform="translate(420, 0)">
    <!-- Kicker Tag -->
    <g transform="translate(0, 78)">
      <rect x="0" y="0" width="220" height="24" rx="12" fill="#0F172A" stroke="#0284C7" stroke-width="1.2" />
      <circle cx="12" cy="12" r="4" fill="#22D3EE" filter="url(#subtleNeon)" />
      <text x="26" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#38BDF8">MODEL CONTEXT PROTOCOL</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" fill="url(#textGrad)">koality-inventory-mcp</text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8">
      Autonomous warehouse &amp; stock ledger capabilities for modern AI agents.
    </text>

    <!-- Architecture & Capability Pills -->
    <g transform="translate(0, 226)">
      <!-- Pill 1: Stdio Transport -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="38" rx="8" fill="url(#bannerPillBg)" stroke="#334155" stroke-width="1.2" />
        <rect x="10" y="12" width="14" height="14" rx="3" fill="#0284C7" />
        <text x="17" y="23" font-family="monospace" font-size="10" font-weight="700" fill="#E0F2FE" text-anchor="middle">&gt;_</text>
        <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Stdio Transport</text>
      </g>

      <!-- Pill 2: Streamable HTTP -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="194" height="38" rx="8" fill="url(#bannerPillBg)" stroke="#334155" stroke-width="1.2" />
        <circle cx="18" cy="19" r="6" fill="#0D9488" />
        <circle cx="18" cy="19" r="2.5" fill="#5EEAD4" />
        <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Streamable HTTP</text>
      </g>

      <!-- Pill 3: Stock Ledger Engine -->
      <g transform="translate(386, 0)">
        <rect x="0" y="0" width="186" height="38" rx="8" fill="url(#bannerPillBg)" stroke="#334155" stroke-width="1.2" />
        <polygon points="12,19 18,12 24,19 18,26" fill="#6366F1" />
        <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Stock Ledger API</text>
      </g>

      <!-- Pill 4: Node 24+ -->
      <g transform="translate(584, 0)">
        <rect x="0" y="0" width="126" height="38" rx="8" fill="url(#bannerPillBg)" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#34D399">Node 24+</text>
      </g>
    </g>

    <!-- Secondary Meta Row -->
    <g transform="translate(0, 290)" opacity="0.6">
      <text x="0" y="0" font-family="monospace" font-size="12" fill="#64748B">
        CLAUDE DESKTOP · ANTIGRAVITY · CURSOR · REST API V1 INTEGRATION
      </text>
    </g>
  </g>

  <!-- Decorative Corner Accents -->
  <g fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.45">
    <path d="M 24 48 L 24 24 L 48 24" />
    <path d="M 1176 48 L 1176 24 L 1152 24" />
    <path d="M 24 312 L 24 336 L 48 336" />
    <path d="M 1176 312 L 1176 336 L 1152 336" />
  </g>
</svg>
